services:
  - type: web
    name: negotiation-coach
    runtime: java
    rootDir: backend
    buildCommand: mvn package -DskipTests
    startCommand: java -jar target/negotiation-coach-0.0.1-SNAPSHOT.jar
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: "8080"
    healthCheckPath: /api/negotiate/health
